<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Netsips Web Clipper</title>
  <style>
    :root {
      --google-blue: #1a73e8;
      --google-blue-hover: #1557b0;
      --google-blue-active: #174ea6;
      --google-blue-surface: #e8f0fe;
      --google-blue-border: #d2e3fc;
      --google-surface: #ffffff;
      --google-bg: #f8f9fa;
      --google-border: #dadce0;
      --google-border-hover: #bdc1c6;
      --google-text-primary: #202124;
      --google-text-secondary: #5f6368;
      --google-text-meta: #70757a;
      --google-success: #1e8e3e;
      --google-success-surface: #e6f4ea;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-pill: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--google-surface);
      color: var(--google-text-primary);
      width: 360px;
      padding: 16px;
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    /* Google Header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--google-border);
      margin-bottom: 14px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo {
      width: 22px;
      height: 22px;
      border-radius: var(--radius-sm);
      display: block;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--google-text-primary);
      letter-spacing: -0.01em;
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 500;
      background: var(--google-blue-surface);
      color: var(--google-blue);
      padding: 1px 7px;
      border-radius: 10px;
      border: 1px solid var(--google-blue-border);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background-color 0.15s ease;
      color: var(--google-text-secondary);
    }

    .icon-btn:hover {
      background-color: rgba(60, 64, 67, 0.08);
      color: var(--google-text-primary);
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Active Tab Preview (Google Keep Card style) */
    .card-preview {
      background: var(--google-surface);
      border: 1px solid var(--google-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: 0 1px 2px 0 rgba(60, 64, 67, 0.1);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .card-preview:hover {
      border-color: var(--google-border-hover);
      box-shadow: 0 1px 3px 0 rgba(60, 64, 67, 0.2);
    }

    .card-banner {
      width: 100%;
      height: 90px;
      background-color: #f1f3f4;
      background-size: cover;
      background-position: center;
      display: none;
      border-bottom: 1px solid var(--google-border);
    }

    .card-body {
      padding: 12px 14px;
    }

    .banner-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      font-size: 11.5px;
      color: var(--google-text-secondary);
    }

    .banner-favicon {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      display: block;
    }

    #page-domain {
      font-weight: 500;
      color: var(--google-text-secondary);
    }

    .article-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--google-text-primary);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
    }

    .article-stats {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #f1f3f4;
      color: var(--google-text-secondary);
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 500;
    }

    /* Tag Section */
    .form-group {
      margin-bottom: 14px;
    }

    .tag-label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--google-text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .tag-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .tag-input {
      width: 100%;
      padding: 9px 12px;
      font-family: inherit;
      font-size: 13px;
      background: #ffffff;
      border: 1px solid var(--google-border);
      border-radius: var(--radius-sm);
      color: var(--google-text-primary);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .tag-input:focus {
      border-color: var(--google-blue);
      box-shadow: 0 0 0 1px var(--google-blue);
    }

    .tag-input::placeholder {
      color: #9aa0a6;
    }

    .quick-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .quick-chip {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--google-text-secondary);
      background: #f1f3f4;
      border: 1px solid transparent;
      padding: 3px 10px;
      border-radius: 14px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .quick-chip:hover {
      background: #e8eaed;
      color: var(--google-text-primary);
    }

    .quick-chip.selected {
      background: var(--google-blue-surface);
      color: var(--google-blue);
      border-color: var(--google-blue-border);
    }

    /* Save Button */
    .btn-save {
      width: 100%;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 500;
      color: #ffffff;
      background: var(--google-blue);
      border: none;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 1px 2px 0 rgba(60, 64, 67, 0.3);
    }

    .btn-save svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .btn-save:hover {
      background: var(--google-blue-hover);
      box-shadow: 0 1px 3px 0 rgba(60, 64, 67, 0.3), 0 2px 6px 2px rgba(60, 64, 67, 0.15);
    }

    .btn-save:active {
      background: var(--google-blue-active);
    }

    .btn-save:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-save.success {
      background: var(--google-success);
      box-shadow: 0 1px 2px rgba(30, 142, 62, 0.3);
    }

    /* Recents Drawer (Google Keep Notes List style) */
    .recents-wrapper {
      margin-top: 14px;
      border-top: 1px solid var(--google-border);
      padding-top: 10px;
    }

    .recents-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 4px 0;
      user-select: none;
    }

    .recents-title {
      font-size: 11px;
      font-weight: 500;
      color: var(--google-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .recents-arrow {
      width: 16px;
      height: 16px;
      fill: var(--google-text-secondary);
      transition: transform 0.2s ease;
    }

    .recents-arrow.open {
      transform: rotate(180deg);
    }

    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 8px;
    }

    .recent-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      background: transparent;
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--google-text-primary);
      transition: background-color 0.15s ease;
      cursor: pointer;
    }

    .recent-item:hover {
      background: #f1f3f4;
    }

    .recent-favicon {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .recent-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }

    .recent-name {
      font-size: 12.5px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--google-text-primary);
    }

    .recent-domain {
      font-size: 11px;
      color: var(--google-text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .recent-empty {
      font-size: 12px;
      color: var(--google-text-secondary);
      text-align: center;
      padding: 12px 0;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="app-header">
    <div class="brand-wrap">
      <img class="brand-logo" src="images/extension_images/icon_128.png" alt="Netsips">
      <span class="brand-title">Netsips</span>
      <span class="brand-badge">Clipper</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="dashboard-icon" title="Open Reading Library">
        <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
      </button>
      <button class="icon-btn" id="settings-icon" title="Settings">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>
    </div>
  </header>

  <!-- Article Preview Card -->
  <section class="card-preview">
    <div id="hero-banner" class="card-banner"></div>
    <div class="card-body">
      <div class="banner-meta">
        <img id="page-favicon" class="banner-favicon" src="images/extension_images/icon_128.png" alt="">
        <span id="page-domain">Active Tab</span>
      </div>
      <div id="modal-content">
        <h2 id="website-title" class="article-title">Current Webpage</h2>
      </div>
      <div class="article-stats">
        <span id="stat-words" class="stat-pill" style="display: none;">
          <span id="word_count">0</span> words
        </span>
        <span id="stat-time" class="stat-pill" style="display: none;">
          ⏱ <span id="est_time">1 min read</span>
        </span>
      </div>
    </div>
  </section>

  <!-- Save Form -->
  <form id="addbookmark">
    <input id="email" name="email" value="" type="hidden"/>
    <input id="uid" name="uid" value="" type="hidden"/>
    <input id="url" name="url" value="" type="hidden"/>

    <div class="form-group">
      <label class="tag-label" for="popup_tags">Tags</label>
      <div class="tag-input-wrap">
        <input type="text" id="popup_tags" class="tag-input" placeholder="Add tags (e.g. read later, dev)..." autocomplete="off" />
      </div>
      <div class="quick-tags" id="quick-tags">
        <span class="quick-chip" data-tag="read-later">+ read later</span>
        <span class="quick-chip" data-tag="tech">+ tech</span>
        <span class="quick-chip" data-tag="design">+ design</span>
        <span class="quick-chip" data-tag="ideas">+ ideas</span>
      </div>
    </div>

    <button id="save" type="submit" class="btn-save">
      <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
      <span>Save to Library</span>
    </button>
  </form>

  <!-- Recent Bookmarks Accordion -->
  <section class="recents-wrapper">
    <div class="recents-header" id="drop-menu">
      <span class="recents-title">Recent Saves</span>
      <svg class="recents-arrow" id="up-icon" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
    </div>
    <div id="recent-container" class="recent-list" style="display: none;"></div>
  </section>

  <script src="db.js"></script>
  <script src="popup_main.js"></script>
</body>
</html>
