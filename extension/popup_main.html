<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Netsips Web Clipper</title>
  <style>
    @font-face {
      font-family: 'Manrope';
      font-weight: 400 800;
      src: url('fonts/Manrope-VariableFont_wght.ttf') format('truetype');
      font-display: swap;
    }

    :root {
      --bg-popup: #090d16;
      --bg-surface: #131b2e;
      --bg-surface-hover: #1c2742;
      --border-card: rgba(255, 255, 255, 0.08);
      --border-focus: #10b981;
      --text-main: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #8292ab;
      --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --accent-hover: linear-gradient(135deg, #059669 0%, #047857 100%);
      --accent-glow: 0 4px 16px rgba(16, 185, 129, 0.4);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-popup);
      background-image: radial-gradient(ellipse at 50% 0%, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
      color: var(--text-main);
      width: 360px;
      padding: 16px;
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Header Bar */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-card);
      margin-bottom: 14px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 26px;
      height: 26px;
      border-radius: var(--radius-sm);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      font-size: 10px;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 2px 7px;
      border-radius: 10px;
      border: 1px solid rgba(16, 185, 129, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-card);
      cursor: pointer;
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
      color: var(--text-secondary);
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .icon-btn img {
      width: 15px;
      height: 15px;
      opacity: 0.85;
      filter: brightness(0) invert(1);
    }

    /* Hero Article Card */
    .card-preview {
      background: var(--bg-surface);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      transition: all 0.2s ease;
    }

    .card-banner {
      width: 100%;
      height: 100px;
      background: linear-gradient(135deg, #111827 0%, #1f2937 40%, #064e3b 100%);
      background-size: cover;
      background-position: center;
      position: relative;
      display: flex;
      align-items: flex-end;
      padding: 10px 12px;
      box-sizing: border-box;
      transition: background-image 0.3s ease;
    }

    .card-banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.1) 0%, rgba(9, 13, 22, 0.8) 100%);
      pointer-events: none;
    }

    .banner-meta {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #e2e8f0;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }

    .banner-favicon {
      width: 15px;
      height: 15px;
      border-radius: 3px;
      background: #ffffff;
      padding: 1px;
    }

    .card-body {
      padding: 12px;
    }

    .article-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
    }

    .article-stats {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      border: 1px solid var(--border-card);
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }

    /* Tag Section */
    .form-group {
      margin-bottom: 14px;
    }

    .tag-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .tag-prefix {
      position: absolute;
      left: 12px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      pointer-events: none;
    }

    .tag-input {
      width: 100%;
      padding: 10px 12px 10px 30px;
      font-family: inherit;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
    }

    .tag-input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent-gradient);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    .tag-input::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    .quick-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .quick-chip {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-card);
      padding: 3px 9px;
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .quick-chip:hover {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.35);
    }

    .quick-chip.selected {
      background: var(--accent-gradient);
      color: #ffffff;
      border-color: transparent;
    }

    /* Primary Save Button */
    .btn-save {
      width: 100%;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      background: var(--accent-gradient);
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      box-shadow: var(--accent-glow);
      transition: all 0.2s ease;
    }

    .btn-save:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
    }

    .btn-save:active {
      transform: translateY(1px);
    }

    .btn-save:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .btn-save.success {
      background: #059669;
      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.4);
    }

    /* Recents Section */
    .recents-wrapper {
      margin-top: 14px;
      border-top: 1px solid var(--border-card);
      padding-top: 12px;
    }

    .recents-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 4px 2px;
      user-select: none;
    }

    .recents-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .recents-arrow {
      width: 14px;
      height: 14px;
      transition: transform 0.25s ease;
      opacity: 0.6;
      filter: brightness(0) invert(1);
    }

    .recents-arrow.open {
      transform: rotate(180deg);
    }

    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .recent-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .recent-item:hover {
      background: var(--bg-surface-hover);
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateX(2px);
    }

    .recent-favicon {
      width: 15px;
      height: 15px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .recent-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }

    .recent-name {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ffffff;
    }

    .recent-domain {
      font-size: 10.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .recent-empty {
      font-size: 11.5px;
      color: var(--text-muted);
      text-align: center;
      padding: 10px 0;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="app-header">
    <div class="brand-wrap">
      <img class="brand-logo" src="images/extension_images/icon_128.png" alt="Netsips">
      <span class="brand-title">Netsips</span>
      <span class="brand-badge">Clipper</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="dashboard-icon" title="Open Reading Library">
        <img src="images/extension_images/bookmark-w.svg" alt="Library">
      </button>
      <button class="icon-btn" id="settings-icon" title="Preferences">
        <img src="images/extension_images/settings.svg" alt="Settings">
      </button>
    </div>
  </header>

  <!-- Hero Article Preview Card -->
  <section class="card-preview">
    <div id="hero-banner" class="card-banner">
      <div class="banner-meta">
        <img id="page-favicon" class="banner-favicon" src="images/extension_images/icon_128.png" alt="">
        <span id="page-domain">Active Tab</span>
      </div>
    </div>
    <div class="card-body">
      <div id="modal-content">
        <h2 id="website-title" class="article-title">Current Webpage</h2>
      </div>
      <div class="article-stats">
        <span id="stat-words" class="stat-pill" style="display: none;">
          <span id="word_count">0</span> words
        </span>
        <span id="stat-time" class="stat-pill" style="display: none;">
          ⏱ <span id="est_time">1 min</span>
        </span>
      </div>
    </div>
  </section>

  <!-- Save Form -->
  <form id="addbookmark">
    <input id="email" name="email" value="" type="hidden"/>
    <input id="uid" name="uid" value="" type="hidden"/>
    <input id="url" name="url" value="" type="hidden"/>

    <div class="form-group">
      <div class="tag-input-wrap">
        <span class="tag-prefix">#</span>
        <input type="text" id="popup_tags" class="tag-input" placeholder="Add tags (comma separated)..." autocomplete="off" />
      </div>
      <div class="quick-tags" id="quick-tags">
        <span class="quick-chip" data-tag="read-later">+ read later</span>
        <span class="quick-chip" data-tag="tech">+ tech</span>
        <span class="quick-chip" data-tag="design">+ design</span>
        <span class="quick-chip" data-tag="ideas">+ ideas</span>
      </div>
    </div>

    <button id="save" type="submit" class="btn-save">
      <span>Save to Library</span>
    </button>
  </form>

  <!-- Recent Bookmarks Accordion -->
  <section class="recents-wrapper">
    <div class="recents-header" id="drop-menu">
      <span class="recents-title">Recent Saves</span>
      <img src="images/extension_images/arrow-down.svg" class="recents-arrow" id="up-icon" alt="">
    </div>
    <div id="recent-container" class="recent-list" style="display: none;"></div>
  </section>

  <script src="db.js"></script>
  <script src="popup_main.js"></script>
</body>
</html>
