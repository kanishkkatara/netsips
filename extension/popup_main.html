<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Netsips Web Clipper</title>
  <style>
    @font-face {
      font-family: 'Manrope';
      font-weight: 400 800;
      src: url('fonts/Manrope-VariableFont_wght.ttf') format('truetype');
      font-display: swap;
    }

    :root {
      --bg-primary: #ffffff;
      --bg-surface: #f8fafc;
      --bg-surface-hover: #f1f5f9;
      --border-color: #e2e8f0;
      --border-focus: #10b981;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent-primary: #10b981;
      --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --accent-hover: linear-gradient(135deg, #059669 0%, #047857 100%);
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
      --shadow-btn: 0 4px 14px rgba(16, 185, 129, 0.35);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      width: 360px;
      min-height: 200px;
      padding: 14px;
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Header Bar */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 12px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-sm);
    }

    .brand-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .brand-badge {
      font-size: 10px;
      font-weight: 600;
      background: #ecfdf5;
      color: #059669;
      padding: 1px 6px;
      border-radius: 12px;
      border: 1px solid #a7f3d0;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      transition: background-color 0.15s ease, transform 0.15s ease;
      color: var(--text-secondary);
    }

    .icon-btn:hover {
      background-color: var(--bg-surface-hover);
      transform: scale(1.05);
    }

    .icon-btn img {
      width: 16px;
      height: 16px;
      opacity: 0.75;
    }

    .icon-btn:hover img {
      opacity: 1;
    }

    /* Article Hero Card */
    .card-preview {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .card-preview:hover {
      border-color: #cbd5e1;
      box-shadow: var(--shadow-md);
    }

    .card-banner {
      width: 100%;
      height: 96px;
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      background-size: cover;
      background-position: center;
      position: relative;
      display: flex;
      align-items: flex-end;
      padding: 10px 12px;
      color: #ffffff;
      box-sizing: border-box;
      transition: background-image 0.3s ease;
    }

    .card-banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.15) 0%, rgba(0, 0, 0, 0.75) 100%);
      pointer-events: none;
    }

    .banner-meta {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      color: #e2e8f0;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    .banner-favicon {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      background: #ffffff;
      padding: 1px;
    }

    .card-body {
      padding: 10px 12px;
    }

    .article-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .article-stats {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #f1f5f9;
      color: var(--text-secondary);
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 500;
    }

    /* Tag Section */
    .form-group {
      margin-bottom: 12px;
    }

    .tag-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .tag-prefix {
      position: absolute;
      left: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      pointer-events: none;
    }

    .tag-input {
      width: 100%;
      padding: 9px 12px 9px 28px;
      font-family: inherit;
      font-size: 13px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background-color: #ffffff;
      color: var(--text-primary);
      outline: none;
      transition: all 0.2s ease;
    }

    .tag-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    .tag-input::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    .quick-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
    }

    .quick-chip {
      font-size: 11px;
      color: var(--text-secondary);
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 2px 8px;
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .quick-chip:hover {
      background: #ecfdf5;
      color: #059669;
      border-color: #a7f3d0;
    }

    /* Primary Save Button */
    .btn-save {
      width: 100%;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background: var(--accent-gradient);
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      box-shadow: var(--shadow-btn);
      transition: all 0.2s ease;
    }

    .btn-save:hover {
      background: var(--accent-hover);
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.45);
      transform: translateY(-1px);
    }

    .btn-save:active {
      transform: translateY(1px);
      box-shadow: var(--shadow-btn);
    }

    .btn-save:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .btn-save.success {
      background: #059669;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.35);
    }

    /* Recents Section */
    .recents-wrapper {
      margin-top: 14px;
      border-top: 1px solid var(--border-color);
      padding-top: 10px;
    }

    .recents-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 4px 2px;
      user-select: none;
    }

    .recents-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .recents-arrow {
      width: 14px;
      height: 14px;
      transition: transform 0.25s ease;
      opacity: 0.6;
    }

    .recents-arrow.open {
      transform: rotate(180deg);
    }

    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .recent-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 9px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--text-primary);
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .recent-item:hover {
      background: var(--bg-surface-hover);
      border-color: #cbd5e1;
      transform: translateX(2px);
    }

    .recent-favicon {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .recent-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }

    .recent-name {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }

    .recent-domain {
      font-size: 10.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .recent-empty {
      font-size: 11.5px;
      color: var(--text-muted);
      text-align: center;
      padding: 12px 0;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="brand-wrap">
      <img class="brand-logo" src="images/extension_images/icon_128.png" alt="Netsips">
      <span class="brand-name">Netsips</span>
      <span class="brand-badge">Clipper</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="dashboard-icon" title="Open Reading Dashboard">
        <img src="images/extension_images/bookmark.svg" alt="Dashboard">
      </button>
      <button class="icon-btn" id="settings-icon" title="Settings & Sync">
        <img src="images/extension_images/settings.svg" alt="Settings">
      </button>
    </div>
  </header>

  <!-- Article Preview Card -->
  <section class="card-preview">
    <div id="hero-banner" class="card-banner">
      <div class="banner-meta">
        <img id="page-favicon" class="banner-favicon" src="images/extension_images/icon_128.png" alt="">
        <span id="page-domain">Web Page</span>
      </div>
    </div>
    <div class="card-body">
      <div id="modal-content">
        <h2 id="website-title" class="article-title">Loading page details...</h2>
      </div>
      <div class="article-stats">
        <span id="stat-words" class="stat-pill" style="display: none;">
          <span id="word_count">0</span> words
        </span>
        <span id="stat-time" class="stat-pill" style="display: none;">
          ⏱ <span id="est_time">1 min</span>
        </span>
      </div>
    </div>
  </section>

  <!-- Save Form -->
  <form id="addbookmark">
    <input id="email" name="email" value="" type="hidden"/>
    <input id="uid" name="uid" value="" type="hidden"/>
    <input id="url" name="url" value="" type="hidden"/>

    <div class="form-group">
      <div class="tag-input-wrap">
        <span class="tag-prefix">#</span>
        <input type="text" id="popup_tags" class="tag-input" placeholder="Add tags (e.g. tech, ideas)..." autocomplete="off" />
      </div>
      <div class="quick-tags" id="quick-tags">
        <span class="quick-chip" data-tag="read-later">+ read later</span>
        <span class="quick-chip" data-tag="tech">+ tech</span>
        <span class="quick-chip" data-tag="design">+ design</span>
        <span class="quick-chip" data-tag="notes">+ notes</span>
      </div>
    </div>

    <button id="save" type="submit" class="btn-save">
      <span>Save to Netsips</span>
    </button>
  </form>

  <!-- Recent Bookmarks Accordion -->
  <section class="recents-wrapper">
    <div class="recents-header" id="drop-menu">
      <span class="recents-title">Recent Saves</span>
      <img src="images/extension_images/arrow-down.svg" class="recents-arrow" id="up-icon" alt="">
    </div>
    <div id="recent-container" class="recent-list" style="display: none;"></div>
  </section>

  <script src="db.js"></script>
  <script src="popup_main.js"></script>
</body>
</html>
