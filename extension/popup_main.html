<!DOCTYPE html>
<html>
<head>
   <title>Netsips</title>

    <style>
        @font-face {
 font-family: 'Manrove-cards';
 font-weight:200rem;
 src: url('chrome-extension://gbahaeoliekjdeaklngijenopidoifhc/fonts/Manrope-VariableFont_wght.ttf'); 
}
      html,
      body {
      font-family: 'Manrove-cards';
      
        margin: 0;
        min-height: 180px;
        padding: 0;
        width: 250px;
	color: #4c4e4d;
      }
      h1 {
font-family: 'Courgette', cursive;

        font-size: 22px;
        font-weight: 400;
        margin: 0;
        color: #FFF000;
      }
      
      img {
        width: 30px;
      }
      .modal-header {
        align-items: center;
        border-bottom: 0.5px solid #dadada;
	background: #313131;
  
  
      }
      .modal-content {
      
        text-align:center;
	color: #4c4e4d;
  
      }
      .modal-icons {
        border-top: 0.5px solid #dadada;
        height: 50px;
        width: 100%;
      }
      .logo {
        padding: 12px;
        text-align: left;
        font-weight:bold;
        
      }
  
      #btncontainer{
        text-align: center;
      }
      #save{
       font-family: 'Manrove-cards';
        border-radius: 5px;
        width: 224px;
        height:40px;
        border:none;
        margin-bottom:10px;
        background: white;
        transition: 0.3s;
        font-size:16px
       
      }

     input{
       font-size:15px
     }

      #addbookmark{
        text-align: center;
      }
      #email{
         width: 150px;
         
          border-radius: 2px;
         border:1px solid #cccccc;
       
      }
      #url{
         width: 150px;
        
         border-radius: 2px;
         border:1px solid #cccccc;
         
      }
      p{
        padding: 0px 15px 0px 15px;
        text-align:left;
        font-size:16.5px;
        font-weight:light;
      }
      img{
        height:15px;
        width:15px;
        margin:4px 5px -2px 4px;
        opacity:90%;
      }
      h3{
        padding-left:15px;
        margin-bottom:-5px;
      }
      #save:hover{
       border:none;
        background: #313131;
        color:#FFF000;
     
      }
      h3{
        color: rgb(0,0,0,0.8);
      }
      #main-logo{
         width:105px;
         height:35px;
         margin: 0px 0px -12px 0px;
      }
      #settings-icon{
          position: absolute;
     right: 5px;
     top: 15px;
     

   
      }
      #settings-icon{
        cursor: pointer;
      }
      #popup_tags{
       
        width:85%;
        padding:3px 3px 3px 4px;
        border-radius: 2px;
        border-top:none;
        border-left:none;
        border-right:none;
        border-bottom: 1px solid #cccccc
      }
       #popup_tags:focus{
       outline:none
      }
      .recent{
        margin:20px;
     padding: 8px 15px 8px 10px;
        text-align:left;
        font-size:15px;
        text-decoration:none;
        font-family: Helvetica, sans-serif;
        font-weight:lighter;
        
        
      }
      .recent a{
        color:#202020;
         text-decoration:none;
         transition:0.2s;
      }
      .recent :hover{
        color:#3498DB 
      }
      #recent-container{
        margin-top:0px;
        display: inline-block;
        margin-bottom:10px;
        display:block
      }
      #recent-heading{

      }
     
      tr:nth-child(even) {
  background-color: #dddddd;
}
    </style>
    
  
</head>
<body>
    <div class="modal-header">
      <h1 class="logo">
      <center><span><img id="main-logo"src="images/yellow_netsips.svg"></span></center>
      </h1>
       <span><img id="settings-icon"src="images/menu_icon.svg"></span>
    </div>
   
    <div id="modal-content">
    
    </div>
    <form id="addbookmark">  
            <input  id="email" name="email" value="" placeholder="Enter your email" type="hidden"/>    
              <input  id="uid" name="uid" value="" placeholder="" type="hidden" style="display:none"/>                  
            <input type="hidden" id="url" name="url" value="" readonly style="display:none"/>
     
              <input type="text" id="popup_tags" placeholder="Add tags..."/>
              <p >
          Number of words: <span id="word_count"></span>
            <span id="est_time" style="display:none"></span></p>
      <!--      <p id='recent-container'>Recents:
            </p>-->
            <input id="save" type="submit" value="Save to Netsips" />
            
    </form><div style='border-top: 0.5px solid #202020; margin:0 15px 0 15px; padding-top:10px;cursor:pointer;'id='drop-menu'>
<span style='padding: 0px 0px 15px 15px;text-align:left;
        font-size:15px;
        font-weight:light;'>Recents</span><span><img src='images/arrow-up.svg' style='opacity:0.7; transition: opacity 1s ease-in-out;'id="up-icon"></span>
        <table id='recent-container' style=' border-collapse: collapse;margin-top:10px;cellspacing="0";width="100%"; border="0";  cellpadding="0";'></table></div>
      <script src="firebase/firebase-app.js"></script>
    <script src="firebase/firebase-firestore.js"></script>
    <script src="popup_main.js"></script>

</body>
</html>
