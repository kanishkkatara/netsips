<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="new_icon.png"/>
  <title>New Tab</title>
  <style>
    :root {
      --brand-purple: #5a2cb6;
      --brand-purple-hover: #4a2399;
      --brand-purple-surface: #f3e8ff;
      --brand-purple-border: #e9d5ff;
      --google-surface: #ffffff;
      --google-bg: #ffffff;
      --google-border: #dadce0;
      --google-border-hover: #bdc1c6;
      --google-text-primary: #202124;
      --google-text-secondary: #5f6368;
      --google-text-meta: #70757a;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-pill: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--google-bg);
      color: var(--google-text-primary);
      -webkit-font-smoothing: antialiased;
    }

    .dashboard-container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px 24px 60px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Bar */
    .top-nav {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      margin-bottom: 32px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }

    .brand-group img {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-sm);
    }

    .brand-name {
      font-size: 16px;
      font-weight: 500;
      color: var(--google-text-secondary);
      letter-spacing: -0.01em;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-nav {
      background: transparent;
      border: 1px solid var(--google-border);
      border-radius: var(--radius-sm);
      color: var(--google-text-secondary);
      height: 36px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn-nav:hover {
      background: var(--brand-purple-surface);
      color: var(--brand-purple);
      border-color: var(--brand-purple-border);
    }

    .btn-nav svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Central Search Experience (Google New Tab Vibe) */
    .search-hero {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
      margin-bottom: 36px;
    }

    .hero-logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .hero-logo-img {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(90, 44, 182, 0.2);
    }

    .hero-title {
      font-size: 32px;
      font-weight: 500;
      color: var(--google-text-primary);
      letter-spacing: -0.02em;
    }

    .search-wrapper {
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon-left {
      position: absolute;
      left: 16px;
      width: 20px;
      height: 20px;
      fill: var(--google-text-secondary);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 48px;
      padding: 0 50px 0 48px;
      font-family: inherit;
      font-size: 15px;
      color: var(--google-text-primary);
      background: #ffffff;
      border: 1px solid var(--google-border);
      border-radius: var(--radius-pill);
      outline: none;
      box-shadow: 0 1px 3px rgba(60, 64, 67, 0.1);
      transition: background-color 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .search-input:hover {
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.2);
      border-color: transparent;
    }

    .search-input:focus {
      border-color: transparent;
      box-shadow: 0 1px 6px 0 rgba(90, 44, 182, 0.25);
    }

    .search-input::placeholder {
      color: var(--google-text-secondary);
    }

    .search-btn {
      position: absolute;
      right: 6px;
      width: 36px;
      height: 36px;
      background: transparent;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--google-text-secondary);
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .search-btn:hover {
      background-color: var(--brand-purple-surface);
      color: var(--brand-purple);
    }

    .search-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Google Speed Dial (Circle Shortcuts) */
    .speed-dial {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 44px;
      max-width: 680px;
    }

    .shortcut-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      width: 80px;
      padding: 8px 4px;
      border-radius: var(--radius-md);
      transition: background-color 0.15s ease;
    }

    .shortcut-item:hover {
      background-color: rgba(60, 64, 67, 0.06);
    }

    .shortcut-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #f1f3f4;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .shortcut-item:hover .shortcut-circle {
      background: var(--brand-purple-surface);
      color: var(--brand-purple);
    }

    .shortcut-icon {
      width: 22px;
      height: 22px;
      border-radius: 3px;
    }

    .shortcut-label {
      font-size: 12px;
      font-weight: 400;
      color: var(--google-text-primary);
      max-width: 76px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    /* Bookmarks Section */
    .content-section {
      width: 100%;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--google-border);
    }

    .section-title {
      font-size: 18px;
      font-weight: 500;
      color: var(--google-text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-badge {
      font-size: 11px;
      font-weight: 500;
      background: var(--brand-purple-surface);
      color: var(--brand-purple);
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid var(--brand-purple-border);
    }

    .view-all-link {
      font-size: 13px;
      font-weight: 500;
      color: var(--brand-purple);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .view-all-link:hover {
      text-decoration: underline;
      color: var(--brand-purple-hover);
    }

    /* Bookmarks Grid (Google Product Cards) */
    .bookmarks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 20px;
    }

    .card {
      background: #ffffff;
      border: 1px solid var(--google-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 1px 2px 0 rgba(60,64,67,0.15);
      transition: box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s ease, transform 0.2s ease;
      height: 310px;
    }

    .card:hover {
      border-color: var(--google-border-hover);
      box-shadow: 0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
      transform: translateY(-2px);
    }

    .card-thumb-wrap {
      width: 100%;
      height: 135px;
      background: #f1f3f4;
      position: relative;
      overflow: hidden;
    }

    .card-thumb-wrap a {
      display: block;
      width: 100%;
      height: 100%;
    }

    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.2s ease;
    }

    .topcorner {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 30px;
      height: 30px;
      background: #ffffff;
      border: 1px solid var(--google-border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s ease, background-color 0.15s ease;
      z-index: 10;
      box-shadow: 0 1px 3px rgba(60,64,67,0.3);
    }

    .card:hover .topcorner {
      opacity: 1;
    }

    .topcorner:hover {
      background: #f1f3f4;
    }

    .topcorner svg {
      width: 16px;
      height: 16px;
      fill: var(--google-text-secondary);
    }

    .card-body {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      font-size: 11.5px;
      color: var(--google-text-secondary);
    }

    .card_favicon img {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      display: block;
    }

    .card_site {
      font-weight: 500;
      color: var(--google-text-secondary);
      max-width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card_date {
      margin-left: auto;
      font-size: 11px;
      color: var(--google-text-meta);
    }

    .card_title {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 10px;
      flex: 1;
    }

    .card_title a {
      color: var(--google-text-primary);
      text-decoration: none;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: color 0.15s ease;
    }

    .card_title a:hover {
      color: var(--brand-purple);
    }

    .card-tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: auto;
      padding-top: 6px;
      border-top: 1px solid #f1f3f4;
    }

    .tag-chip {
      font-size: 11px;
      color: var(--google-text-secondary);
      background: #f1f3f4;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 400;
    }

    /* Google Style Empty State */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px 24px;
      background: #ffffff;
      border: 1px solid var(--google-border);
      border-radius: var(--radius-md);
      color: var(--google-text-secondary);
    }

    .empty-icon-wrap {
      width: 52px;
      height: 52px;
      background: var(--brand-purple-surface);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .empty-icon-wrap svg {
      width: 26px;
      height: 26px;
      fill: var(--brand-purple);
    }

    .empty-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--google-text-primary);
      margin-bottom: 6px;
    }

    .empty-desc {
      font-size: 13px;
      color: var(--google-text-secondary);
      max-width: 400px;
      margin: 0 auto 18px auto;
      line-height: 1.5;
    }

    .btn-sample-google {
      background: var(--brand-purple);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 8px 18px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-sample-google:hover {
      background: var(--brand-purple-hover);
      box-shadow: 0 1px 2px 0 rgba(90, 44, 182, 0.3);
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    
    <!-- Top Navigation -->
    <header class="top-nav">
      <a href="new.html" class="brand-group">
        <img src="new_icon.png" alt="Netsips">
        <span class="brand-name">Netsips</span>
      </a>

      <!-- Actions -->
      <div class="nav-actions">
        <button class="btn-nav" id="sc" title="Open Full Library">
          <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
          <span>Library</span>
        </button>
      </div>
    </header>

    <!-- Center Google Search Hero -->
    <div class="search-hero">
      <div class="hero-logo-wrap">
        <img class="hero-logo-img" src="new_icon.png" alt="Netsips">
        <h1 class="hero-title">Netsips</h1>
      </div>

      <!-- Google Omnibox Search Bar -->
      <div class="search-wrapper">
        <svg class="search-icon-left" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="searchBar" class="search-input" placeholder="Search Google or saved items..." autocomplete="off">
        <button id="gsearch" class="search-btn" title="Google Search">
          <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
        </button>
      </div>
    </div>

    <!-- Google Speed Dial Shortcuts -->
    <section class="speed-dial">
      <a href="https://github.com" class="shortcut-item" target="_blank" rel="noopener noreferrer">
        <div class="shortcut-circle">
          <img class="shortcut-icon" src="https://s2.googleusercontent.com/s2/favicons?domain_url=github.com" alt="">
        </div>
        <span class="shortcut-label">GitHub</span>
      </a>
      <a href="https://news.ycombinator.com" class="shortcut-item" target="_blank" rel="noopener noreferrer">
        <div class="shortcut-circle">
          <img class="shortcut-icon" src="https://s2.googleusercontent.com/s2/favicons?domain_url=news.ycombinator.com" alt="">
        </div>
        <span class="shortcut-label">Hacker News</span>
      </a>
      <a href="https://reddit.com" class="shortcut-item" target="_blank" rel="noopener noreferrer">
        <div class="shortcut-circle">
          <img class="shortcut-icon" src="https://s2.googleusercontent.com/s2/favicons?domain_url=reddit.com" alt="">
        </div>
        <span class="shortcut-label">Reddit</span>
      </a>
      <a href="https://youtube.com" class="shortcut-item" target="_blank" rel="noopener noreferrer">
        <div class="shortcut-circle">
          <img class="shortcut-icon" src="https://s2.googleusercontent.com/s2/favicons?domain_url=youtube.com" alt="">
        </div>
        <span class="shortcut-label">YouTube</span>
      </a>
      <a href="https://wikipedia.org" class="shortcut-item" target="_blank" rel="noopener noreferrer">
        <div class="shortcut-circle">
          <img class="shortcut-icon" src="https://s2.googleusercontent.com/s2/favicons?domain_url=wikipedia.org" alt="">
        </div>
        <span class="shortcut-label">Wikipedia</span>
      </a>
      <a href="settings.html" class="shortcut-item">
        <div class="shortcut-circle">
          <svg style="width:20px;height:20px;fill:var(--brand-purple);" viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
        </div>
        <span class="shortcut-label">Library</span>
      </a>
    </section>

    <!-- Recent Bookmarks Section -->
    <section class="content-section">
      <div class="section-header">
        <h2 class="section-title" id="recents">
          <span>Recent Bookmarks</span>
          <span class="section-badge">Offline-First</span>
        </h2>
        <a href="settings.html" class="view-all-link">Open Library &rarr;</a>
      </div>

      <div class="bookmarks-grid" id="news-content">
        <div class="empty-state">
          <div class="empty-icon-wrap">
            <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
          </div>
          <h3 class="empty-title">Your reading list is empty</h3>
          <p class="empty-desc">Clip any webpage using the Netsips extension icon to save it here for reading later.</p>
          <button id="newtab-sample-btn" class="btn-sample-google">+ Load Sample Articles</button>
        </div>
      </div>
    </section>

  </div>

  <script src="db.js"></script>
  <script src="new.js"></script>
</body>
</html>
