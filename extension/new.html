<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="images/extension_images/icon_128.png"/>
  <title>New Tab | Netsips</title>
  <style>
    @font-face {
      font-family: 'Manrope';
      font-weight: 400 800;
      src: url('fonts/Manrope-VariableFont_wght.ttf') format('truetype');
      font-display: swap;
    }

    :root {
      --bg-dark: #090d16;
      --bg-surface: rgba(26, 34, 52, 0.65);
      --bg-surface-hover: rgba(36, 47, 72, 0.85);
      --card-bg: rgba(20, 27, 44, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(16, 185, 129, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100vh;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #090d16 100%);
      background-attachment: fixed;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .dashboard-container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 32px 24px 60px 24px;
    }

    /* Top Bar */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 36px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .brand-group img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #ffffff;
    }

    /* Search Bar */
    .search-wrapper {
      flex: 1;
      max-width: 580px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      height: 48px;
      padding: 0 54px 0 46px;
      font-family: inherit;
      font-size: 15px;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-lg);
      outline: none;
      transition: all 0.25s ease;
    }

    .search-input:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.45);
    }

    .search-icon-left {
      position: absolute;
      left: 16px;
      width: 18px;
      height: 18px;
      opacity: 0.55;
      pointer-events: none;
    }

    .search-btn {
      position: absolute;
      right: 6px;
      width: 36px;
      height: 36px;
      background: var(--accent-gradient);
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .search-btn:hover {
      transform: scale(1.06);
    }

    .search-btn img {
      width: 16px;
      height: 16px;
      filter: brightness(0) invert(1);
    }

    /* Nav Actions */
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-nav {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-sm);
      color: #ffffff;
      height: 40px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-nav:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .btn-nav img {
      width: 16px;
      height: 16px;
    }

    /* Speed Dial Shortcuts */
    .speed-dial {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 40px;
    }

    .shortcut-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .shortcut-pill:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .shortcut-icon {
      width: 16px;
      height: 16px;
      border-radius: 3px;
    }

    /* Section Header */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-badge {
      font-size: 11px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }

    /* Bookmarks Grid */
    .bookmarks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 22px;
    }

    /* Bookmark Card */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--card-border-hover);
      box-shadow: 0 14px 28px -6px rgba(0, 0, 0, 0.5);
    }

    .card-thumb-wrap {
      width: 100%;
      height: 150px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      position: relative;
      overflow: hidden;
    }

    .card-thumb-wrap a {
      display: block;
      width: 100%;
      height: 100%;
    }

    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .card:hover .card-thumb {
      transform: scale(1.04);
    }

    .topcorner {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 28px;
      height: 28px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 10;
    }

    .card:hover .topcorner {
      opacity: 1;
    }

    .topcorner:hover {
      background: rgba(239, 68, 68, 0.85);
      border-color: rgba(239, 68, 68, 1);
      transform: scale(1.1);
    }

    .topcorner img {
      width: 14px;
      height: 14px;
      filter: brightness(0) invert(1);
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .card_favicon img {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      display: block;
    }

    .card_site {
      font-weight: 500;
      color: #cbd5e1;
      max-width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card_date {
      margin-left: auto;
      font-size: 11px;
      color: #64748b;
    }

    .card_title {
      font-size: 14.5px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 12px;
      flex: 1;
    }

    .card_title a {
      color: var(--text-main);
      text-decoration: none;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: color 0.15s ease;
    }

    .card_title a:hover {
      color: #34d399;
    }

    .card-tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: auto;
    }

    .tag-chip {
      font-size: 11px;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 2px 7px;
      border-radius: 4px;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 24px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      color: var(--text-muted);
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    
    <!-- Top Navigation -->
    <header class="top-nav">
      <a href="new.html" class="brand-group">
        <img src="images/extension_images/icon_128.png" alt="Netsips">
        <span class="brand-name">netsips</span>
      </a>

      <!-- Search Bar -->
      <div class="search-wrapper">
        <img class="search-icon-left" src="images/extension_images/search.png" alt="">
        <input type="text" id="searchBar" class="search-input" placeholder="Search Google or saved items..." autocomplete="off">
        <button id="gsearch" class="search-btn" title="Search">
          <img src="images/extension_images/search.png" alt="">
        </button>
      </div>

      <!-- Actions -->
      <div class="nav-actions">
        <button class="btn-nav" id="sc" title="Open Full Dashboard">
          <img src="images/extension_images/bookmark-w.svg" alt="">
          <span>Library</span>
        </button>
      </div>
    </header>

    <!-- Speed Dial Shortcuts -->
    <section class="speed-dial">
      <a href="https://github.com" class="shortcut-pill" target="_blank" rel="noopener noreferrer">
        <img class="shortcut-icon" src="https://s2.googleusercontent.com/s2/favicons?domain_url=github.com" alt="">
        <span>GitHub</span>
      </a>
      <a href="https://news.ycombinator.com" class="shortcut-pill" target="_blank" rel="noopener noreferrer">
        <img class="shortcut-icon" src="https://s2.googleusercontent.com/s2/favicons?domain_url=news.ycombinator.com" alt="">
        <span>Hacker News</span>
      </a>
      <a href="https://reddit.com" class="shortcut-pill" target="_blank" rel="noopener noreferrer">
        <img class="shortcut-icon" src="https://s2.googleusercontent.com/s2/favicons?domain_url=reddit.com" alt="">
        <span>Reddit</span>
      </a>
      <a href="https://youtube.com" class="shortcut-pill" target="_blank" rel="noopener noreferrer">
        <img class="shortcut-icon" src="https://s2.googleusercontent.com/s2/favicons?domain_url=youtube.com" alt="">
        <span>YouTube</span>
      </a>
      <a href="https://wikipedia.org" class="shortcut-pill" target="_blank" rel="noopener noreferrer">
        <img class="shortcut-icon" src="https://s2.googleusercontent.com/s2/favicons?domain_url=wikipedia.org" alt="">
        <span>Wikipedia</span>
      </a>
      <a href="https://twitter.com" class="shortcut-pill" target="_blank" rel="noopener noreferrer">
        <img class="shortcut-icon" src="https://s2.googleusercontent.com/s2/favicons?domain_url=twitter.com" alt="">
        <span>X / Twitter</span>
      </a>
    </section>

    <!-- Recent Bookmarks Section -->
    <section>
      <div class="section-header">
        <h2 class="section-title" id="recents">
          <span>Recent Bookmarks</span>
          <span class="section-badge">Offline-First</span>
        </h2>
      </div>

      <div class="bookmarks-grid" id="news-content">
        <div class="empty-state">Loading your library...</div>
      </div>
    </section>

  </div>

  <script src="db.js"></script>
  <script src="new.js"></script>
</body>
</html>
