<!DOCTYPE html>
<html>
<head>
   <title>Netsips</title>
 

    <style>
    @font-face {
 font-family: 'Manrove-cards';
 font-weight:200rem;
 src: url('fonts/Manrope-VariableFont_wght.ttf'); 
}
      html,
      body {
      font-family: 'Manrove-cards';
        font-size: 14px;
        margin: 0;
        min-height: 180px;
        padding: 0;
        width: 250px;
	color: #4c4e4d;
      }
      h1 {
font-family: 'Courgette', cursive;

        font-size: 22px;
        font-weight: 400;
        margin: 0;
        color: #FFF000;
      }
      
      img {
        width: 30px;
      }
      .modal-header {
        align-items: center;
        border-bottom: 0.5px solid #dadada;
	background: #313131;
  margin-bottom:10px;
  
      }
      .modal-content-2 {
    
       
	color: #4c4e4d;
  
      }
      .modal-icons {
        border-top: 0.5px solid #dadada;
        height: 50px;
        width: 100%;
      }
      .logo {
        padding: 12px;
        text-align: left;
        font-weight:bold;
        
      }
  button:focus {outline:0;}
      #btncontainer{
        text-align: center;
      }
      #ext_link{
         font-family: 'Manrove-cards';
        border-radius: 5px;
        width: 224px;
        height:40px;
        border:none;
        margin-bottom:10px;
        transition: 0.3s;
        font-size:16px;
        background-color:rgb(34,139,34,0.8);
        color:#ffffff;
        cursor:pointer;
      }
      #addbookmark{
        text-align: center;
      }
      #email{
         width: 150px;
         
          border-radius: 2px;
         border:1px solid #cccccc;
       
      }
      #url{
         width: 150px;
        
         border-radius: 2px;
         border:1px solid #cccccc;
         
      }
      p{
        margin-left:10px;
        margin-right:10px;
        padding: 0px;
        text-align:left;
        font-size:15px;
        line-spacing:1;

      }
      img{
        height:15px;
        width:15px;
        margin:4px 5px -2px 4px;
        opacity:90%;
      }
      h3{
        padding-left:15px;
        margin-bottom:-5px;
      }
      #ext_link:hover{

        border:none;
         background-color:rgb(34,139,34);
        color:#FFFFFF;
      }
      h3{
        color: rgb(0,0,0,0.8);
      }
      #main-logo{
         width:90px;
         height:30px;
         margin: 0px 0px -12px 0px;
      }
      #settings-icon{
          position: absolute;
     right: 0;
     top: 0;
   
      }
      #settings-icon{
        cursor: pointer;
      }
      .tick{
        color:#3CB371;
        margin-right:1px;
      }
    </style>
    
   
</head>
<body>
    <div class="modal-header">
      <h1 class="logo">
      <center><span><img id="main-logo"src="images/extension_images/yellow_netsips.svg"></span></center>
      </h1>
     
    </div>
   <center id="modal-content-2"> 
   <p><span class="tick">&#10003</span>Save bookmarks using Netsips</p>
   <p><span class="tick">&#10003</span>Manage them in your dashboard</p>
   <p><span class="tick">&#10003</span>Get personalised newsletters</p>
   <p><span class="tick">&#10003</span>Sync with Netsips app</p>
 

    </center>
<center> <button id="ext_link">Open Netsips Dashboard</button></center>
<center> <button id="guest_btn" style="margin-top:2px;margin-bottom:12px;font-family:'Manrove-cards';border-radius:5px;width:224px;height:34px;border:1px solid #ccc;background-color:#f5f5f5;color:#333;font-size:14px;cursor:pointer;">Continue as Guest</button></center>
  
    <script src="popup.js"></script>

</body>
</html>
